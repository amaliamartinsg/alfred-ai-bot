services:
  alfred-bot:
    image: ghcr.io/amaliamartinsg/alfred-ai-bot:latest
    container_name: alfred-bot
    env_file:
      - .env
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ADMIN_USER_ID=${ADMIN_USER_ID}
      - DFT_TIMEZONE=${DFT_TIMEZONE:-Europe/Madrid}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
